
# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# JVM args for the Gradle daemon.
# The --add-exports flags are required because Kotlin 1.8.10's kapt reaches into
# JDK internals (com.sun.tools.javac.*) that JPMS encapsulates on JDK 16+. Without
# these we hit "IllegalAccessError: superclass access check failed" during stub gen.
# This is the JetBrains-recommended fix and is safe on JDK 17 and JDK 21.
org.gradle.jvmargs=-Xmx10G -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Push --add-exports flags to the Kotlin daemon. These open the JDK internals that
# kapt 1.8.10 needs on JDK 16+. Note: comma-separated within this property value.
# IMPORTANT: kapt 1.8.10 also requires the actual JDK version to be ≤17 — the JDK 21
# javac removed methods kapt depends on. Either install JDK 17 (adoptium.net) and
# point JAVA_HOME at it, or let the kotlin { jvmToolchain(17) } block in build.gradle
# auto-provision one via Foojay.
kotlin.daemon.jvm.options=-Xmx2G,--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED,--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
