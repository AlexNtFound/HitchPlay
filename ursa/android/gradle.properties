# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
#android.enableJetifier=true
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Model Missing Error Message
missingModelErrorMsg="ML model file(s) are missing. Please refer to the app README for instructions on how to compile and place the model(s)."

# Repository was likely not cloned with LFS Error Message (some assets are ascii files)
missingLfsErrorMsg = "Project assets are missing. Please make sure the git repository is cloned with LFS (https://git-lfs.com/) enabled."

# Java Settings
javaSourceCompatibilityVersion=11
javaTargetCompatibilityVersion=11

# Android Settings
# Minimum is Android 12 Snow Cone (API v31) — required by ChatApp module.
# Target  is Android 14 Upside Down Cake (API v34).
androidMinSDK=31
androidTargetSDK=34
androidCompileSDK=34

# QNN Settings — must match the QAIRT version used to compile the model .bin files.
qnnVersion=2.42.0

# Classifier Application Settings
includeClassificationApp=true
classification_tfLiteModelAsset=classification.tflite
classification_tfLiteLabelsAsset=labels.txt

# Semantic Segmentation Application Settings
includeSemanticSegmentationApp=true
semanticsegmentation_tfLiteModelAsset=segmentation.tflite

# Super Resolution Application Settings
includeSuperResolutionApp=true
superresolution_tfLiteModelAsset=superresolution.tflite

# ChatApp Application Settings
includeChatApp=true

#set it true when developing
android.injected.testOnly=false
android.nonFinalResIds=false