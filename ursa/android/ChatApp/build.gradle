plugins {
    id "com.android.application"
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'kotlinx-serialization'
}

// Path to local QNN SDK.
// Resolution order: local.properties (qnn.sdk.dir) -> env QNN_SDK_ROOT.
// Configure ONCE per machine in android/local.properties:
//     qnn.sdk.dir=C:/Qualcomm/AIStack/QAIRT/2.42.0.251225
// Download QNN SDK from https://qpm.qualcomm.com/#/main/tools/details/qualcomm_ai_engine_direct
def _localProps = new Properties()
def _lpFile = rootProject.file("local.properties")
if (_lpFile.exists()) { _lpFile.withInputStream { _localProps.load(it) } }
def qnnSDKLocalPath = _localProps.getProperty("qnn.sdk.dir") ?: System.getenv("QNN_SDK_ROOT") ?: ""
// List of model assets
def models = ["qwen2_5_7b_instruct"]
// Relative asset path for model configuration and binaries
def relAssetsPath = "src/main/assets/models/"
def buildDir = project(":ChatApp").getLayout().getBuildDirectory()
def libsDir = buildDir.dir("libs")

android {
    compileSdk Integer.valueOf(androidCompileSDK)

    defaultConfig {
        applicationId "com.quicinc.chatapp"
        minSdk Integer.valueOf(androidMinSDK)
        targetSdk Integer.valueOf(androidTargetSDK)
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a"
                arguments "-DQNN_SDK_ROOT_PATH=" + qnnSDKLocalPath
            }
        }
        sourceSets {
            main {
                jniLibs.srcDir libsDir
            }
        }
        signingConfig signingConfigs.debug
    }

    // Release signing config.
    //
    // The keystore is NEVER committed to git — it's gitignored. For an open-source
    // repo, committing the keystore lets anyone build a malicious APK signed as Ursa,
    // which Android would let install as an "update" over the legitimate app.
    //
    // Each developer either:
    //   (a) Generates their own keystore for personal builds (see BUILD_GUIDE.md), or
    //   (b) Receives the team's shared keystore + password out-of-band (password
    //       manager / encrypted channel) — only the team release manager needs this.
    //
    // Credentials come from android/local.properties (gitignored). If the keystore
    // file or password is missing, release builds fall back to producing an unsigned
    // APK rather than failing the build. Debug builds are unaffected either way.
    signingConfigs {
        release {
            def kf = rootProject.file("ChatApp/ursa-release.keystore")
            def kp = _localProps.getProperty("ursa.release.storePassword")
            def ka = _localProps.getProperty("ursa.release.keyAlias")
            def kpw = _localProps.getProperty("ursa.release.keyPassword")
            if (kf.exists() && kp && ka && kpw) {
                storeFile kf
                storePassword kp
                keyAlias ka
                keyPassword kpw
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            crunchPngs true
            // R8 minification is disabled for now: the project uses Hilt, Compose,
            // kotlinx-serialization, OkHttp, and JNI — all reflection-heavy. Enabling
            // minification without curating proguard-rules.pro tends to cause runtime
            // crashes. Re-enable when someone has time to validate the rules.
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Apply release signing only if everything is configured. Otherwise the
            // build proceeds with no signing config — the APK is built unsigned and
            // can't be installed, but the build itself succeeds. Lets fresh clones
            // run `assembleRelease` without first generating a keystore.
            def kf = rootProject.file("ChatApp/ursa-release.keystore")
            if (kf.exists()
                && _localProps.getProperty("ursa.release.storePassword")
                && _localProps.getProperty("ursa.release.keyAlias")
                && _localProps.getProperty("ursa.release.keyPassword")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.4.2'
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    namespace "com.quicinc.chatapp"
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    aaptOptions {
        noCompress "bin", "json"
    }

    preBuild.doFirst {
        // ----- QNN SDK presence checks (actionable errors) -----
        if (qnnSDKLocalPath == null || qnnSDKLocalPath.isEmpty()) {
            throw new GradleException(
                "\n[Ursa] QNN SDK path is not configured.\n" +
                "Fix: add this line to android/local.properties:\n" +
                "    qnn.sdk.dir=C:/Qualcomm/AIStack/QAIRT/2.42.0.251225\n" +
                "(or set the QNN_SDK_ROOT environment variable)\n" +
                "Download: https://qpm.qualcomm.com/#/main/tools/details/qualcomm_ai_engine_direct\n")
        }
        if (!file(qnnSDKLocalPath).exists()) {
            throw new GradleException(
                "\n[Ursa] QNN SDK directory not found at:\n    " + qnnSDKLocalPath + "\n" +
                "Fix: verify the `qnn.sdk.dir` value in android/local.properties points at an existing QAIRT install.\n")
        }
        if (!file(qnnSDKLocalPath + "/lib/aarch64-android/libGenie.so").exists()) {
            throw new GradleException(
                "\n[Ursa] libGenie.so not found under:\n    " + qnnSDKLocalPath + "/lib/aarch64-android/\n" +
                "The configured path is not a valid QAIRT SDK root, or is missing the aarch64-android libs.\n" +
                "Required version for the bundled model bins: QAIRT 2.42.0.\n")
        }

        // ----- Model asset checks -----
        models.each { model ->
            def modelDir = relAssetsPath + model
            def cfg = modelDir + "/genie-config.json"
            def tok = modelDir + "/tokenizer.json"
            if (!file(cfg).exists() || !file(tok).exists()) {
                throw new GradleException(
                    "\n[Ursa] Missing model assets for '" + model + "'.\n" +
                    "Expected files (gitignored — must be placed manually):\n" +
                    "    android/ChatApp/" + cfg + "\n" +
                    "    android/ChatApp/" + tok + "\n" +
                    "Download both from the shared model drive (see BUILD_GUIDE.md \"Quick Start\" step 2).\n")
            }
        }

        // ----- Guard against stray .bin files in assets -----
        // The APK ZIP32 format caps total uncompressed size at 4 GB; a single .bin can
        // get us close. Bins are downloaded at runtime now (see ModelProvisioner), so
        // any .bin under assets/models/ is dead weight that breaks the build with an
        // opaque "integer overflow" error at packageDebug. Catch it here with a clear msg.
        def strayBins = fileTree(dir: relAssetsPath, include: "**/*.bin").files
        if (!strayBins.isEmpty()) {
            def list = strayBins.collect { "    " + it }.join("\n")
            throw new GradleException(
                "\n[Ursa] Stray model .bin files found under src/main/assets/models/:\n" +
                list + "\n" +
                "Bins are downloaded at runtime now — they MUST NOT be bundled in the APK.\n" +
                "Delete them (they are gitignored, so safe to remove):\n" +
                "    Remove-Item -Recurse -Force <path-to-bin>\n")
        }

        def libsABIDir = buildDir.dir("libs/arm64-v8a")
        copy {
            from qnnSDKLocalPath

            include "**/lib/aarch64-android/libQnnHtp.so"
            include "**/lib/aarch64-android/libQnnHtpPrepare.so"
            include "**/lib/aarch64-android/libQnnSystem.so"
            include "**/lib/aarch64-android/libQnnSaver.so"
            include "**/lib/hexagon-v**/unsigned/libQnnHtpV**Skel.so"
            include "**/lib/aarch64-android/libQnnHtpV**Stub.so"

            into libsABIDir
            // Copy libraries without directory structure
            eachFile {
                path = name
            }
            includeEmptyDirs = false
        }
    }
}

dependencies {
    implementation fileTree(include: ["*.jar", "*.aar"], dir: "libs")
    implementation files('libs/qtld-release')
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.guava:guava:32.1.2-android'

    // joystick
    // implementation 'io.github.controlwear:virtualjoystick:1.10.1'
    implementation 'com.github.controlwear:virtual-joystick-android:master-SNAPSHOT'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation "androidx.hilt:hilt-navigation-compose:1.0.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1"
    // implementation 'androidx.compose.material3:material3-android:1.3.2'
    //implementation 'androidx.compose.material3:material3-android:1.3.2'

    // Compose
    def compose_version = "1.4.0"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    // implementation 'androidx.compose.material3:material3:1.1.0-beta01'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.compose.material:material-icons-extended:1.4.0'
    implementation 'androidx.compose.ui:ui-viewbinding:1.4.0'
    implementation 'androidx.compose.ui:ui-util:1.4.0'
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"

    // Firebase
//    implementation platform('com.google.firebase:firebase-bom:31.3.0')
//    implementation 'com.google.firebase:firebase-analytics-ktx'
//    implementation 'com.google.firebase:firebase-firestore-ktx'

    // Dagger Hilt
//    implementation "com.google.dagger:hilt-android:2.44"
//    kapt "com.google.dagger:hilt-compiler:2.44"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.44"
    kapt "com.google.dagger:hilt-compiler:2.44"

//// Hilt with ViewModel
//    implementation "androidx.hilt:hilt-lifecycle-viewmodel:1.0.0-alpha03"
//    kapt "androidx.hilt:hilt-compiler:1.0.0"
//
//// Lifecycle ViewModel
//    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
//    implementation "androidx.hilt:hilt-lifecycle-viewmodel:1.0.0-alpha03"
//    kapt "androidx.hilt:hilt-compiler:1.0.0"

    // Serialization & coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation 'com.google.code.gson:gson:2.9.0'

    // TensorFlow
    implementation 'org.tensorflow:tensorflow-lite:2.13.0'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.9.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.3'
    implementation 'org.tensorflow:tensorflow-lite-task-vision-play-services:0.4.2'

    // Networking
    def retrofit_version = '2.9.0'
    def okhttp_version = '4.10.0'
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"

    // Rich Text
    def richtext_version = '0.16.0'
    implementation "com.halilibo.compose-richtext:richtext-commonmark:$richtext_version"
    implementation "com.halilibo.compose-richtext:richtext-ui-material:$richtext_version"
    implementation "com.halilibo.compose-richtext:richtext-ui-material3:$richtext_version"

    // Utilities
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.28.0"
    implementation "com.bytedance.tools.codelocator:codelocator-core:2.0.4"
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation("io.coil-kt:coil-compose:2.3.0")

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Voicecontrol
    implementation 'ai.picovoice:porcupine-android:3.0.2'
    implementation 'androidx.core:core-ktx:1.12.0'
}

// Pin Kotlin compilation to JDK 17 regardless of JAVA_HOME.
// Android Studio Ladybug bundles JBR 21, which Kotlin 1.8.10's compiler can't target —
// without this, kapt fails with "Unknown Kotlin JVM target: 21". Foojay (registered in
// settings.gradle) auto-downloads a JDK 17 if the machine doesn't already have one.
kotlin {
    jvmToolchain(17)
}

if (System.getProperty("user.dir") != project.rootDir.path) {
    throw new RuntimeException("This project should be opened from the `android` directory (parent of ChatApp directory), NOT the ChatApp directory.")
}
